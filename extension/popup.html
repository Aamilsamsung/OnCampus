<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:350px;padding:16px;color:#183126;background:#f5f8f5}h1{margin:0}p{color:#52665a;line-height:1.5}button{background:#214b37;color:white;border:0;padding:11px;border-radius:8px;cursor:pointer}input,select{padding:8px;max-width:95%}.box{background:white;padding:12px;margin:12px 0;border:1px solid #ddd;border-radius:9px}label{display:block;margin:8px 0}#status{white-space:pre-wrap;font-size:12px}</style></head><body><h1>OnCampus</h1><p>Scan the WhatsApp chat you're currently viewing. Only approved groups can be scanned.</p><div class="box"><button id="approve">Approve current chat</button><button id="scan">Scan current chat</button><p id="current"></p></div><div class="box"><label><input type="checkbox" id="autoScan"> Also watch new messages in approved chats</label><label>Campus <select id="campus"><option>Electronic City</option><option>Ring Road</option><option>Hanumanth Nagar</option></select></label><label>Admin access token (short-lived, not service key)<input type="password" id="token" placeholder="Token"></label><button id="save">Save settings</button><label><input type="checkbox" id="autoSubmit"> Submit detected candidates to private review queue</label><button id="send">Retry queued submissions</button><p id="count"></p></div><p id="status" role="status"></p><p>Unknown or expired event dates require review. Scans loaded messages only; WhatsApp Web must be open.</p><script src="popup.js"></script></body></html>
